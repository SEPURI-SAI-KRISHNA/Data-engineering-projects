[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "datactl"
version = "0.1.0"
description = "Datasets as code: one spec in git, infrastructure reconciled to match"
requires-python = ">=3.10"
dependencies = ["pyyaml"]

[project.scripts]
datactl = "datactl.cli:main"

[tool.setuptools.packages.find]
include = ["datactl*"]
